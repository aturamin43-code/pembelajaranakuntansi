<h1>Selamat Datang, Bapak/Ibu Guru Praktik Akuntansi!</h1><p style="color:var(--mut)">Perangkat Pembelajaran Akuntansi (PPA) - Perusahaan Jasa Kelas XI</p>

const LS={g(k,d){try{const v=localStorage.getItem('ppa_'+k);return v?JSON.parse(v):d}catch(e){return d}},s(k,v){try{localStorage.setItem('ppa_'+k,JSON.stringify(v))}catch(e){}}};
const ic=()=>{try{lucide.createIcons()}catch(e){}};let TM;
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)};
const openM=h=>{$('#modal').innerHTML=`<div class="mb"><button class="ib x" data-a="cm" aria-label="Tutup"><i data-lucide="x"></i></button>${h}</div>`;$('#modal').classList.add('on');ic()};

const M=[['dash','Dasbor','layout-dashboard'],['kelas','Pilih Kelas','school'],['modul','Modul & Perangkat','file-text'],['materi','Materi & Kuis','book-open'],['game','Permainan','gamepad-2'],['lkpd','Generator LKPD','clipboard-list'],['sim','Simulasi Transaksi','calculator'],['siswa','Daftar Siswa','users'],['hadir','Presensi','calendar-check'],['nilai','Buku Nilai','graduation-cap'],['jadwal','Jadwal Mengajar','calendar-days'],['atur','Pengaturan','settings']];

let S=Object.assign({user:null,kls:0,page:'dash',pal:'mint',prof:{nama:'',nip:'19800101 200501 1 001',mapel:'Praktik Akuntansi Perusahaan Jasa',sekolah:'SMK Negeri 1 Semarang',npsn:'20300001',alamat:'Jl. Pemuda No. 1, Semarang'},docs:{},mat:{},quiz:null,att:{},nil:{},sch:null,custom:[],inact:{},log:[],adt:iso(new Date())},LS.g('st',{}));

/* ===== DATA ===== */
const DOCS=[['CP & ATP',`<h2>Capaian Pembelajaran & Alur Tujuan Pembelajaran</h2><p><b>Mata pelajaran:</b> Praktik Akuntansi Perusahaan Jasa<br><b>Fase/Kelas:</b> F / XI &nbsp; <b>Alokasi:</b> 144 JP per tahun</p><h3>Capaian Pembelajaran</h3><p>Peserta didik mampu menganalisis bukti transaksi, mencatat transaksi ke jurnal umum dan buku besar, menyusun neraca saldo, jurnal penyesuaian, kertas kerja, laporan keuangan, dan jurnal penutup pada perusahaan jasa, secara manual maupun digital, dengan teliti, jujur, dan bertanggung jawab.</p><h3>Alur Tujuan Pembelajaran</h3><table><tr><th>No</th><th>Tujuan Pembelajaran</th><th>JP</th></tr><tr><td>1</td><td>Menjelaskan pengertian dan karakteristik perusahaan jasa</td><td>6</td></tr><tr><td>2</td><td>Menganalisis bukti transaksi (nota, faktur, kuitansi)</td><td>12</td></tr><tr><td>3</td><td>Mencatat transaksi ke jurnal umum</td><td>20</td></tr><tr><td>4</td><td>Memposting jurnal ke buku besar</td><td>16</td></tr><tr><td>5</td><td>Menyusun neraca saldo dan jurnal penyesuaian</td><td>24</td></tr><tr><td>6</td><td>Menyusun kertas kerja 10 kolom</td><td>20</td></tr><tr><td>7</td><td>Menyusun laporan keuangan (laba rugi, perubahan ekuitas, posisi keuangan)</td><td>26</td></tr><tr><td>8</td><td>Membuat jurnal penutup dan neraca saldo setelah penutupan</td><td>20</td></tr></table>`],
['Modul Ajar',`<h2>Modul Ajar: Jurnal Umum Perusahaan Jasa</h2><table><tr><th>Satuan Pendidikan</th><td>SMK/SMA</td><th>Kelas / Fase</th><td>XI / F</td></tr><tr><th>Alokasi Waktu</th><td>4 x 45 menit</td><th>Model</th><td>Problem Based Learning</td></tr></table><h3>Tujuan Pembelajaran</h3><p>Peserta didik dapat menganalisis bukti transaksi dan mencatatnya ke jurnal umum secara tepat dan teliti.</p><h3>Pemahaman Bermakna & Pertanyaan Pemantik</h3><p>Pencatatan yang benar menjadi dasar laporan keuangan yang dapat dipercaya. <i>Mengapa setiap transaksi harus memiliki bukti? Apa akibatnya jika akun salah dicatat?</i></p><h3>Kegiatan Pembelajaran</h3><p><b>Pendahuluan (15 menit):</b> salam, doa, presensi, apersepsi tentang nota yang pernah dilihat siswa, penyampaian tujuan.</p><p><b>Inti (150 menit):</b> (1) orientasi masalah melalui studi kasus Salon Glow & Shine; (2) siswa berkelompok mengidentifikasi akun dan menganalisis transaksi; (3) mengisi LKPD jurnal umum; (4) presentasi dan tanggapan antar kelompok; (5) guru meluruskan konsep.</p><p><b>Penutup (15 menit):</b> simpulan, refleksi, kuis singkat, tugas posting ke buku besar.</p><h3>Asesmen</h3><p>Formatif: observasi dan kuis. Sumatif: tes tertulis dan praktik jurnal. Remedial: latihan transaksi dasar. Pengayaan: transaksi kompleks (piutang dan utang).</p><h3>Refleksi Guru</h3><p>Bagian mana yang masih sulit dipahami siswa? Apa perbaikan untuk pertemuan berikutnya?</p>`],
['Bahan Ajar',`<h2>Handout Siswa: Siklus Akuntansi Perusahaan Jasa</h2><p><b>Persamaan dasar:</b> Aset = Liabilitas + Ekuitas</p><h3>Tahapan Siklus</h3><p>Bukti transaksi, jurnal umum, buku besar, neraca saldo, jurnal penyesuaian, kertas kerja, laporan keuangan, jurnal penutup, neraca saldo setelah penutupan.</p><h3>Aturan Debet dan Kredit</h3><table><tr><th>Kelompok Akun</th><th>Bertambah</th><th>Berkurang</th></tr><tr><td>Aset</td><td>Debet</td><td>Kredit</td></tr><tr><td>Liabilitas</td><td>Kredit</td><td>Debet</td></tr><tr><td>Ekuitas (Modal)</td><td>Kredit</td><td>Debet</td></tr><tr><td>Prive</td><td>Debet</td><td>Kredit</td></tr><tr><td>Pendapatan</td><td>Kredit</td><td>Debet</td></tr><tr><td>Beban</td><td>Debet</td><td>Kredit</td></tr></table><h3>Rumus Penting</h3><p>Laba bersih = Pendapatan - Beban<br>Modal akhir = Modal awal + Laba bersih - Prive</p>`],

delq:t=>{S.quiz.items.splice(+t.dataset.i,1);save();R()},
addq:()=>openM(`<h3>Tambah Soal</h3><div class="f"><label for="qt">Jenis</label><select id="qt" data-ch="qt"><option value="pg">Pilihan Ganda</option><option value="es">Uraian / Esai</option></select><label for="qq">Pertanyaan</label><textarea id="qq" rows="2"></textarea><div id="qpg">${[0,1,2,3].map(i=>`<label for="qo${i}">Opsi ${'ABCD'[i]}</label><input id="qo${i}">`).join('')}<label for="qk">Kunci jawaban</label><select id="qk"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></div><div id="qes" class="hid"><label for="qke">Kunci jawaban uraian</label><textarea id="qke" rows="3"></textarea></div></div><div class="err" id="qe"></div><button class="btn" data-a="saveq">Simpan Soal</button>`),
saveq:()=>{const t=$('#qt').value,q=$('#qq').value.trim();if(!q){$('#qe').textContent='Pertanyaan wajib diisi.';return}if(t=='pg'){const o=[0,1,2,3].map(i=>$('#qo'+i).value.trim());if(o.some(x=>!x)){$('#qe').textContent='Semua opsi wajib diisi.';return}S.quiz.items.push({t,q,o,k:+$('#qk').value})}else{const k=$('#qke').value.trim();if(!k){$('#qe').textContent='Kunci uraian wajib diisi.';return}S.quiz.items.push({t,q,k})}save();closeM();R();toast('Soal ditambahkan')},
runq:()=>{const q=S.quiz;if(!q.items.length){toast('Tambahkan soal terlebih dahulu');return}let s=q.dur*60;openM(`<h3>Kuis <span id="tm" class="badge m-peach"></span></h3>${q.items.map((x,i)=>`<div class="card" style="background:var(--bg)"><b>${i+1}. ${x.q}</b>${x.t=='pg'?x.o.map((o,j)=>`<br><label><input type="radio" name="q${i}" value="${j}" style="width:auto"> ${o}</label>`).join(''):`<textarea id="e${i}" rows="2"></textarea>`}</div>`).join('')}<button class="btn" data-a="sbq">Kumpulkan</button>`);const u=()=>{const m=$('#tm');if(m)m.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(s--<=0){clearInterval(TM);H.sbq()}};u();TM=setInterval(u,1000)},
sbq:()=>{clearInterval(TM);const q=S.quiz.items,pg=q.filter(x=>x.t=='pg');let b=0;q.forEach((x,i)=>{if(x.t=='pg'){const r=document.querySelector(`input[name=q${i}]:checked`);if(r&&+r.value==x.k)b++}});openM(`<h3>Hasil Kuis</h3><p>Pilihan ganda benar: <b>${b} / ${pg.length}</b> (skor ${pg.length?Math.round(b/pg.length*100):0}). Soal uraian dinilai guru dengan kunci berikut.</p>${q.filter(x=>x.t=='es').map(x=>`<p><b>${x.q}</b><br>Kunci: ${x.k}</p>`).join('')}`)},
gm:t=>{G.gm=t.dataset.v;R()},pick:(t,e)=>{const g=G.dk,i=+t.dataset.i;if(g.c)return;if(g.D.includes(i)||g.K.includes(i)){g.D=g.D.filter(x=>x!=i);g.K=g.K.filter(x=>x!=i);g.p.push(i);g.s=null}else g.s=g.s==i?null:i;e.stopPropagation();R()},
zone:t=>{const g=G.dk;if(g.s===null||g.c)return;g.p=g.p.filter(x=>x!=g.s);g[t.dataset.z].push(g.s);g.s=null;R()},dkc:()=>{G.dk.c=1;R()},dkr:()=>{G.dk=null;R()},
pzn:()=>{G.pz=(G.pz+1)%PZ.length;R()},fcf:()=>{G.fc.f=!G.fc.f;R()},fcn:()=>{G.fc={i:(G.fc.i+1)%FC.length,f:0};R()},fcp:()=>{G.fc={i:(G.fc.i+FC.length-1)%FC.length,f:0};R()},
lko:t=>{G.lk=+t.dataset.i;G.lkk=0;R()},lkb:()=>{G.lk=null;R()},
lkn:()=>openM(`<h3>Buat LKPD Kustom</h3><div class="f"><label for="lt">Judul studi kasus</label><input id="lt"><label for="ll">Level</label><select id="ll"><option>Mudah</option><option>Sedang</option><option>Sulit</option></select><label for="ld">Deskripsi kasus</label><textarea id="ld" rows="3"></textarea><label for="ls">Soal (satu soal per baris)</label><textarea id="ls" rows="4"></textarea><label for="lc">Kunci jawaban</label><textarea id="lc" rows="4"></textarea></div><div class="err" id="le"></div><button class="btn" data-a="lks">Simpan LKPD</button>`),
lks:()=>{const t=$('#lt').value.trim(),s=$('#ls').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!t||!s.length){$('#le').textContent='Judul dan minimal satu soal wajib diisi.';return}S.custom.push({custom:1,lv:$('#ll').value,ttl:t,sc:'LKPD kustom',d:$('#ld').value,tasks:s,key:$('#lc').value||'Kunci belum diisi.'});log('Membuat LKPD: '+t);save();closeM();G.lk=null;R();toast('LKPD tersimpan')},
sl:t=>{G.sl=+t.dataset.i;R()},rst:()=>R(),chk:()=>{let ok=0,tot=0;SIM[G.sl].s.forEach((s,i)=>s.f.forEach((f,j)=>{const e=$(`#f${i}_${j}`),v=typeof f.a=='number'?+e.value.replace(/\D/g,''):e.value;tot++;const g=v===f.a;if(g)ok++;e.classList.toggle('ok',g);e.classList.toggle('bad',!g)}));$('#ss').textContent=`Benar ${ok} / ${tot}`;log(`Simulasi ${SIM[G.sl].t}: ${ok}/${tot}`);save()},
att:t=>{S.att[S.kls][S.adt][t.dataset.i]=t.dataset.v;save();R()},cyc:t=>{const v=sched()[t.dataset.d][t.dataset.j];sched()[t.dataset.d][t.dataset.j]=v>=2?-1:v+1;save();R()},
pal:t=>{S.pal=t.dataset.v;save();R()},sp:()=>{const p={};['nama','nip','mapel','sekolah','npsn','alamat'].forEach(k=>p[k]=$('#p_'+k).value.trim());if(!p.nama||!p.sekolah){$('#pe').textContent='Nama guru dan sekolah wajib diisi.';return}S.prof=p;save();R();toast('Profil disimpan')},
bk:()=>openM(`<h3>Ekspor / Pulihkan Data</h3><div class="f"><label for="bj">Data cadangan (salin dan simpan)</label><textarea id="bj" rows="8" readonly>${JSON.stringify(S).replace(/</g,'&lt;')}</textarea></div><div class="bar" style="margin-top:8px"><button class="btn s" data-a="cp">Salin</button></div><div class="f"><label for="bi">Tempel cadangan untuk dipulihkan</label><textarea id="bi" rows="3"></textarea></div><button class="btn" data-a="rs">Pulihkan</button>`),
cp:()=>{try{navigator.clipboard.writeText($('#bj').value);toast('Disalin')}catch(e){$('#bj').select();toast('Pilih dan salin manual')}},rs:()=>{try{S=Object.assign(S,JSON.parse($('#bi').value));save();closeM();R();toast('Data dipulihkan')}catch(e){toast('Format cadangan tidak valid')}},
wipe:()=>{if(confirm('Hapus semua data dan keluar?')){try{localStorage.removeItem('ppa_st')}catch(e){}location.reload()}},
go2:t=>{$('#sr').hidden=true;$('#q').value='';if(t.dataset.m)G.mt=+t.dataset.m,G.mq='m';H.go(t)}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&H[t.dataset.a])H[t.dataset.a](t,e);if(!e.target.closest('.sb'))$('#sr').hidden=true});
document.addEventListener('mousedown',e=>{if(e.target.closest('.tbr'))e.preventDefault()});
const CH={dur:t=>{S.quiz.dur=Math.min(180,Math.max(1,+t.value||15));save()},lkk:t=>{G.lkk=t.checked;R()},sk:t=>{G.sk=t.checked;R()},tg:t=>{S.inact[t.dataset.i]=!t.checked;save();R()},adt:t=>{if(t.value){S.adt=t.value;R()}},qt:t=>{$('#qpg').classList.toggle('hid',t.value!='pg');$('#qes').classList.toggle('hid',t.value=='pg')}};
document.addEventListener('change',e=>{const t=e.target.closest('[data-ch]');if(t&&CH[t.dataset.ch])CH[t.dataset.ch](t)});
const IN={nl:t=>{let v=Math.min(100,Math.max(0,+t.value||0));const n=nilai(S.kls,t.dataset.i,+t.dataset.r);n[+t.dataset.k]=v;const f=fin(n),el=$('#fn'+t.dataset.i);el.textContent=f;el.className=f<75?'bad':'';save()},
pz:t=>{const z=PZ[G.pz];let d=0,k=0;z.r.forEach(r=>{const v=r[2]===null?+t.value.replace(/\D/g,''):r[2];r[1]=='D'?d+=v:k+=v});$('#pzs').innerHTML=d==k&&t.value?'<b style="color:#2e8b57">Seimbang! Debet = Kredit = Rp'+rp(d)+'</b>':`<b>Debet Rp${rp(d)} | Kredit Rp${rp(k)} | Selisih Rp${rp(Math.abs(d-k))}</b>`;t.classList.toggle('ok',d==k&&!!t.value)},
q:t=>{const v=t.value.toLowerCase().trim(),r=$('#sr');if(!v){r.hidden=true;return}const hits=M.filter(m=>m[1].toLowerCase().includes(v)).map(m=>[m[1],m[0],'']).concat(MAT.map((m,i)=>[m[0],'materi',i]).filter(m=>m[0].toLowerCase().includes(v)));r.innerHTML=hits.slice(0,6).map(h=>`<button data-a="go2" data-p="${h[1]}" data-m="${h[2]}">${h[0]}</button>`).join('')||'<button disabled>Tidak ditemukan</button>';r.hidden=false}};
document.addEventListener('input',e=>{const t=e.target.closest('[data-in]');if(t&&IN[t.dataset.in])IN[t.dataset.in](t)});
document.addEventListener('dragstart',e=>{const c=e.target.closest('.chipx');if(c)e.dataTransfer.setData('text/plain',c.dataset.i)});
document.addEventListener('dragover',e=>{const z=e.target.closest('.zone');if(z){e.preventDefault();z.classList.add('hot')}});
document.addEventListener('dragleave',e=>{const z=e.target.closest('.zone');if(z)z.classList.remove('hot')});
document.addEventListener('drop',e=>{const z=e.target.closest('.zone');if(!z||!G.dk||G.dk.c)return;e.preventDefault();const i=+e.dataTransfer.getData('text/plain'),g=G.dk;g.p=g.p.filter(x=>x!=i);g.D=g.D.filter(x=>x!=i);g.K=g.K.filter(x=>x!=i);g[z.dataset.z].push(i);g.s=null;R()});
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeM();if(e.key=='Enter'&&e.target.id=='un')H.login();if(e.key=='Enter'&&e.target.dataset.a=='fcf')H.fcf()});
$('#modal').addEventListener('click',e=>{if(e.target.id=='modal')closeM()});
R();
</script></body></html>
